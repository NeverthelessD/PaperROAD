  <rect x="320" y="680" width="150" height="74" rx="16" fill="#C62828"/>
  <text x="395" y="733" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#FFFFFF" letter-spacing="2">PDF</text>
