    <filter id="outer" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#outer)"/>
  <g filter="url(#sh)">
    <path d="M330 214h250l166 166v398a32 32 0 0 1-32 32H330a32 32 0 0 1-32-32V246a32 32 0 0 1 32-32z" fill="url(#paper)"/>
    <path d="M580 214v134a32 32 0 0 0 32 32h134z" fill="#F2B807"/>
  </g>
  <rect x="368" y="300" width="160" height="26" rx="13" fill="#5B6270"/>
